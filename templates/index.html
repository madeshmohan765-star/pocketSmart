<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketSmart AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 10px;
            min-height: 50px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>🤖 PocketSmart AI</h1>

            <p class="subtitle">
                Your smart assistant
            </p>

            <textarea
                id="message"
                placeholder="Type your message here..."
            ></textarea>

            <button onclick="sendMessage()">
                Send
            </button>

            <div id="result">
                Your response will appear here.
            </div>

        </div>
    </div>

    <script>
        async function sendMessage() {
            const messageBox = document.getElementById("message");
            const result = document.getElementById("result");

            const message = messageBox.value.trim();

            if (!message) {
                result.textContent = "Please enter a message.";
                return;
            }

            result.textContent = "Thinking...";

            try {
                const response = await fetch("/api/message", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                const data = await response.json();

                if (data.success) {
                    result.textContent = data.reply;
                } else {
                    result.textContent = data.reply || "Something went wrong.";
                }

            } catch (error) {
                result.textContent =
                    "Could not connect to the PocketSmart server.";
            }
        }
    </script>

</body>
</html>
